name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Otkaži stare runove iste grane/PR-a kad stigne novi push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Brzi statički checkovi — padaju prvi (prije skupljeg e2e/build).
  quality:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # Bonus: hvata build greške (next build) koje lint/typecheck ne uhvate.
  build:
    name: build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx next build --webpack

  e2e:
    name: playwright
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Svi Playwright projekti (desktop/tablet/mobile) koriste Chromium.
      - run: npx playwright install --with-deps chromium
      # Playwright sam diže 3 dev servera (normalni / prazni / error seam) iz playwright.config.ts.
      # CI=true → reuseExistingServer:false, forbidOnly:true, retries:1.
      - run: npx playwright test
        env:
          CI: "true"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
